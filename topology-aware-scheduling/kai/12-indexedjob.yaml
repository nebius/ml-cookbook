apiVersion: scheduling.run.ai/v2alpha2
kind: PodGroup
metadata:
  name: megatron-tas-kai-job
  namespace: tas-kai
  labels:
    kai.scheduler/queue: gb300-tas-kai
spec:
  queue: gb300-tas-kai
  minSubGroup: 2
  topologyConstraint:
    topology: nebius-gb300-kai-guide
    requiredTopologyLevel: topology.nebius.com/gpu-cluster-id
  subGroups:
    - name: segment-0
      minMember: 16
      topologyConstraint:
        topology: nebius-gb300-kai-guide
        requiredTopologyLevel: topology.nebius.com/nvl-instance-group-id
    - name: segment-1
      minMember: 16
      topologyConstraint:
        topology: nebius-gb300-kai-guide
        requiredTopologyLevel: topology.nebius.com/nvl-instance-group-id
---
apiVersion: v1
kind: Service
metadata:
  name: megatron-tas-kai-job
  namespace: tas-kai
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: megatron-tas-kai-job
  ports:
    - name: rendezvous
      port: 12345
      targetPort: 12345
---
apiVersion: batch/v1
kind: Job
metadata:
  name: megatron-tas-kai-job-segment-0
  namespace: tas-kai
  annotations:
    kai.scheduler/skip-podgrouper: "true"
spec:
  completions: 16
  parallelism: 16
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      annotations:
        pod-group-name: megatron-tas-kai-job
      labels:
        app.kubernetes.io/name: megatron-tas-kai-job
        kai.scheduler/queue: gb300-tas-kai
        kai.scheduler/subgroup-name: segment-0
    spec:
      schedulerName: kai-scheduler
      subdomain: megatron-tas-kai-job
      restartPolicy: Never
      activeDeadlineSeconds: 21600
      terminationGracePeriodSeconds: 120
      nodeSelector:
        node.kubernetes.io/instance-type: gpu-gb300
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-master
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /opt/tas/wait-master.sh
          env:
            - name: RANK_OFFSET
              value: "0"
            - name: MASTER_ADDR
              value: megatron-tas-kai-job-segment-0-0.megatron-tas-kai-job
          volumeMounts:
            - name: scripts
              mountPath: /opt/tas
              readOnly: true
      containers:
        - name: megatron-bridge
          image: nvcr.io/nvidia/nemo:26.06
          imagePullPolicy: IfNotPresent
          command:
            - /opt/tas/train.sh
          ports:
            - name: rendezvous
              containerPort: 12345
          env:
            - name: RANK_OFFSET
              value: "0"
            - name: MASTER_ADDR
              value: megatron-tas-kai-job-segment-0-0.megatron-tas-kai-job
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: TORCH_NCCL_AVOID_RECORD_STREAMS
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "False"
            - name: TORCH_NCCL_HIGH_PRIORITY
              value: "1"
            - name: CUDA_DEVICE_MAX_CONNECTIONS
              value: "32"
            - name: NVTE_FWD_LAYERNORM_SM_MARGIN
              value: "20"
            - name: NVTE_BWD_LAYERNORM_SM_MARGIN
              value: "20"
            - name: NCCL_MNNVL_ENABLE
              value: "1"
            - name: NCCL_DEBUG
              value: INFO
            - name: NCCL_DEBUG_SUBSYS
              value: INIT,NET,GRAPH,NVLS
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "108"
              memory: 720Gi
            limits:
              nvidia.com/gpu: "4"
              cpu: "112"
              memory: 760Gi
          securityContext:
            privileged: true
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          volumeMounts:
            - name: scripts
              mountPath: /opt/tas
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: infiniband
              mountPath: /dev/infiniband
            - name: imex-channels
              mountPath: /dev/nvidia-caps-imex-channels
      volumes:
        - name: scripts
          configMap:
            name: megatron-tas-scripts
            defaultMode: 365
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: infiniband
          hostPath:
            path: /dev/infiniband
            type: Directory
        - name: imex-channels
          hostPath:
            path: /dev/nvidia-caps-imex-channels
            type: Directory
---
