apiVersion: v1
kind: ConfigMap
metadata:
  name: megatron-tas-scripts
data:
  rank-env.sh: |-
    #!/bin/sh
    set -eu

    if [ -n "${NODE_RANK:-}" ]; then
      : # A controller-specific Downward API entry already supplied the rank.
    elif [ -n "${JOB_COMPLETION_INDEX:-}" ]; then
      NODE_RANK=$((JOB_COMPLETION_INDEX + ${RANK_OFFSET:-0}))
    elif [ -n "${VC_TASK_INDEX:-}" ]; then
      NODE_RANK="${VC_TASK_INDEX}"
    else
      echo "error: NODE_RANK, JOB_COMPLETION_INDEX, or VC_TASK_INDEX is required" >&2
      exit 1
    fi

    case "${NODE_RANK}" in
      ''|*[!0-9]*)
        echo "error: invalid node rank: ${NODE_RANK}" >&2
        exit 1
        ;;
    esac

    : "${MASTER_ADDR:?MASTER_ADDR is required}"
    MASTER_PORT="${MASTER_PORT:-12345}"
    export NODE_RANK MASTER_ADDR MASTER_PORT

  wait-master.sh: |-
    #!/bin/sh
    set -eu
    . /opt/tas/rank-env.sh

    [ "${NODE_RANK}" = "0" ] && exit 0
    echo "waiting for DNS: ${MASTER_ADDR}"
    until nslookup "${MASTER_ADDR}" >/dev/null 2>&1; do sleep 2; done
    echo "waiting for rendezvous port ${MASTER_ADDR}:${MASTER_PORT}"
    until nc -z -w 2 "${MASTER_ADDR}" "${MASTER_PORT}"; do sleep 2; done

  train.sh: |-
    #!/bin/bash
    set -euo pipefail
    source /opt/tas/rank-env.sh
    : "${HF_TOKEN:?HF_TOKEN is required}"

    exec torchrun \
      --nnodes=32 \
      --nproc_per_node=4 \
      --node_rank="${NODE_RANK}" \
      --master_addr="${MASTER_ADDR}" \
      --master_port="${MASTER_PORT}" \
      --numa-binding=exclusive \
      /opt/Megatron-Bridge/scripts/performance/run_script.py \
        --account root --partition main \
        --gpu gb300 \
        --num_gpus 128 \
        --gpus_per_node 4 \
        --model_family_name qwen \
        --model_recipe_name qwen3_235b_a22b \
        --cuda_graph_impl=transformer_engine \
        --cuda_graph_scope=moe_router,moe_preprocess \
        --hf_token "${HF_TOKEN}" \
        --max_steps 50 \
        --compute_dtype fp8_mx \
        -tp 1 -pp 4 -vp 12 -cp 1 -ep 32 -et 1 \
        -gb 8192 -mb 2 \
        train.manual_gc=true train.manual_gc_interval=100

  train-and-hold.sh: |-
    #!/bin/bash
    set -uo pipefail
    /opt/tas/train.sh
    rc=$?
    if (( rc != 0 )); then
      exit "${rc}"
    fi

    echo "training completed; holding the Pod until LeaderWorkerSet deletion"
    exec sleep infinity
