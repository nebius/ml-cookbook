apiVersion: v1
kind: Service
metadata:
  name: megatron-tas-kueue
  namespace: tas-kueue
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    batch.kubernetes.io/job-name: megatron-tas-kueue
  ports:
    - name: rendezvous
      port: 12345
      targetPort: 12345
---
apiVersion: batch/v1
kind: Job
metadata:
  name: megatron-tas-kueue
  namespace: tas-kueue
  labels:
    kueue.x-k8s.io/queue-name: gb300
spec:
  suspend: true
  completions: 32
  parallelism: 32
  completionMode: Indexed
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: megatron-tas-kueue
      annotations:
        kueue.x-k8s.io/podset-slice-required-topology-constraints: |-
          [
            {
              "topology": "topology.nebius.com/gpu-cluster-id",
              "size": 32
            },
            {
              "topology": "topology.nebius.com/nvl-instance-group-id",
              "size": 16
            }
          ]
    spec:
      subdomain: megatron-tas-kueue
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-master
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /opt/tas/wait-master.sh
          env:
            - name: MASTER_ADDR
              value: megatron-tas-kueue-0.megatron-tas-kueue
          volumeMounts:
            - name: scripts
              mountPath: /opt/tas
              readOnly: true
      containers:
        - name: megatron-bridge
          image: nvcr.io/nvidia/nemo:26.06
          imagePullPolicy: IfNotPresent
          command:
            - /opt/tas/train.sh
          ports:
            - name: rendezvous
              containerPort: 12345
          env:
            - name: MASTER_ADDR
              value: megatron-tas-kueue-0.megatron-tas-kueue
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: TORCH_NCCL_AVOID_RECORD_STREAMS
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "False"
            - name: TORCH_NCCL_HIGH_PRIORITY
              value: "1"
            - name: CUDA_DEVICE_MAX_CONNECTIONS
              value: "32"
            - name: NVTE_FWD_LAYERNORM_SM_MARGIN
              value: "20"
            - name: NVTE_BWD_LAYERNORM_SM_MARGIN
              value: "20"
            - name: NCCL_MNNVL_ENABLE
              value: "1"
            - name: NCCL_DEBUG
              value: INFO
            - name: NCCL_DEBUG_SUBSYS
              value: INIT,NET,GRAPH,NVLS
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "108"
              memory: 720Gi
            limits:
              nvidia.com/gpu: "4"
              cpu: "112"
              memory: 760Gi
          securityContext:
            privileged: true
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          volumeMounts:
            - name: scripts
              mountPath: /opt/tas
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: infiniband
              mountPath: /dev/infiniband
            - name: imex-channels
              mountPath: /dev/nvidia-caps-imex-channels
      volumes:
        - name: scripts
          configMap:
            name: megatron-tas-scripts
            defaultMode: 365
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: infiniband
          hostPath:
            path: /dev/infiniband
            type: Directory
        - name: imex-channels
          hostPath:
            path: /dev/nvidia-caps-imex-channels
            type: Directory
