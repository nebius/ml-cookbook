[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nebius-gpu-preflight"
version = "0.1.0"
description = "Static container-image readiness checks for Nebius GPU hardware"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Nebius"}]
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
gpu-preflight = "gpu_preflight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpu_preflight = ["data/profiles/*.toml"]
